# Workday boards as "tenant.instance/site" (from the board URL:
# https://TENANT.INSTANCE.myworkdayjobs.com/SITE/...). Queried with
# searchText=intern server-side. Slugs verified live 2026-08-03.
[sources.workday]
# COST NOTE: Workday is the expensive source. searchText is fuzzy, so a board
# returns mostly non-intern hits (measured 2026-08-07: of NVIDIA's first 200
# hits only 10 were real intern titles, Adobe 1, Micron 12, Mastercard 4), and
# the fetcher pages to MAX_RESULTS=1000 — roughly 50 requests per board per
# run. Greenhouse/Ashby return a whole board in ONE request, so prefer them.
# That is why this list is curated to big names with a real CS-undergrad
# pipeline rather than every tenant that resolved. All probed live 2026-08-07.
boards = [
    "arrowstreetcapital.wd5/Campus_Careers",
    "paloaltonetworks.wd5/panwexternalcareers",
    "synchronyfinancial.wd5/University",
    "ciena.wd5/Careers",
    "nvidia.wd5/NVIDIAExternalCareerSite",
    "salesforce.wd12/External_Career_Site",
    "capitalone.wd12/Capital_One",
    "mastercard.wd1/CorporateCareers",
    "blackrock.wd1/BlackRock_Professional",
    "adobe.wd5/external_experienced",
    "target.wd5/targetcareers",
    "comcast.wd5/Comcast_Careers",
]

# SmartRecruiters company identifiers (from jobs.smartrecruiters.com/IDENTIFIER/...).
[sources.smartrecruiters]
companies = ["LinkedIn3", "WesternDigital", "LLNL", "BoschGroup"]
# US-only: global boards like BoschGroup are ~90% international otherwise
# (verified live 2026-08-05: 1230 -> 104 postings with country=us).
country = "us"

[notify]
# Opens one GitHub Issue per run listing all new matches (GitHub then emails
# you). Needs GITHUB_TOKEN + GITHUB_REPOSITORY env vars — both are present
# automatically in GitHub Actions.
github_issues = true
# Discord fires when the DISCORD_WEBHOOK_URL env var is set; nothing to
# configure here.
