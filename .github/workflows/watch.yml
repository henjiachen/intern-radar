name: watch

# Independent GitHub-hosted runner; no personal computer required.
# Never add pull_request or pull_request_target triggers with write permissions.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Mark everything currently live as seen (no notifications)"
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true  # the watcher pushes with GITHUB_TOKEN itself

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run watcher
        env:
          PYTHONPATH: src
          RADAR_GIT: "1"
          RADAR_RUNNER: actions
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RADAR_BOOTSTRAP: ${{ inputs.bootstrap == true && 'true' || 'false' }}
        run: |
          git config user.name "intern-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python -m intern_radar

      - name: Keepalive
        run: |
          # GitHub disables cron workflows after 60 days without repo activity;
          # an empty commit at 50 days resets that clock. Mac commits count as
          # activity too, so this only fires if the Mac has been off for weeks.
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          if [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt 4320000 ]; then
            git commit --allow-empty -m "chore: keepalive [skip ci]"
            git push
          fi
