name: watch
on:
  # Exercise the real watcher on this review branch before merging. This
  # trigger never runs on pull_request and ignores the bot's data commits.
  push:
    branches: [customize-ucsd-ai-2027]
    paths: [".github/workflows/watch.yml", "src/intern_radar/**"]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Baseline without notifying (requires all sources healthy)"
        type: boolean
        default: false
permissions:
  contents: write
  issues: write
concurrency:
  group: watch-${{ github.ref }}
  cancel-in-progress: false
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test before sending
        run: |
          python -m pip install pytest pyyaml
          python -m pytest -q
      - name: Scan profile
        env:
          PYTHONPATH: src
          BASELINE: ${{ inputs.bootstrap == true && 'true' || 'false' }}
        run: |
          args=()
          if [ "$BASELINE" = true ]; then args+=(--baseline); fi
          python -m intern_radar.ucsd --phase scan "${args[@]}"
      - name: Persist notification outbox
        run: |
          git config user.name "intern-radar[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ucsd.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: persist UCSD notification outbox [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Deliver pending notifications
        env:
          PYTHONPATH: src
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python -m intern_radar.ucsd --phase deliver
      - name: Persist delivery receipts
        if: always()
        run: |
          if [ -f data/ucsd.json ]; then
            git add data/ucsd.json
            if [ -d data/alerts ]; then git add data/alerts; fi
            if ! git diff --cached --quiet; then
              git commit -m "chore: persist UCSD notification receipts [skip ci]"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
